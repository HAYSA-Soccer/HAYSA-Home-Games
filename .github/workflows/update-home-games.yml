name: Update Home Games

permissions:
  contents: write

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main

      - name: Download ICS (reliable curl method)
        run: |
          curl -L "http://tmsdln.com/19hyx" -o schedule.ics

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run generator
        run: python3 generate_homegames.py

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Ignore dump file
        run: |
          git rm --cached ics_dump.txt || true
          echo "ics_dump.txt" >> .gitignore

      - name: Commit changes
        run: |
          git add home.html all_games.html .gitignore schedule.ics
          git diff --cached --quiet || git commit -m "Auto-update home games for $(date +'%Y-%m-%d')"

      - name: Push changes
        run: git push origin main
