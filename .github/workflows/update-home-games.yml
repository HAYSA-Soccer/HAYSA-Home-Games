name: Update Home Games

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
  push:
    paths:
      - "cancellations.json"
      - "generate_homegames.py"
      - ".github/workflows/update-home-games.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true
          pip install ics pytz requests

      - name: Pull latest changes
        run: git pull origin main --rebase

      - name: Run Python script
        run: python generate_homegames.py

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Commit changes
        run: |
          git add home.html all_games.html ics_dump.txt || true
          git diff --cached --quiet || git commit -m "Auto-update home games for $(date +'%Y-%m-%d')"

      - name: Push changes
        run: git push origin main
