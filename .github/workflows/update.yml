name: Update Schedule

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Download ICS using real browser
        run: |
          python3 - << 'EOF'
          from playwright.sync_api import sync_playwright

          url = "http://tmsdln.com/19hyx"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url)

              # Wait for the network response
              response = page.wait_for_response(lambda r: r.url == url)
              data = response.body()

              with open("schedule.ics", "wb") as f:
                  f.write(data)

              browser.close()
          EOF

      - name: Install Python deps
        run: pip install ics pytz requests

      - name: Run generator
        run: python3 generate.py

      - name: Commit changes
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update schedule" || echo "No changes"
          git push
